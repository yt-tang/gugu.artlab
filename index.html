<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGU VINTAGE ART LAB - 测算中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f1ec;
            --text-main: #3a3a3a;
            --text-secondary: #6b6b6b;
            --accent-color: #8c7e6a;
            --border-color: #dcd9d2;
        }
        body {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }
        .logo-container {
            max-width: 180px;
            margin: 40px auto;
            opacity: 0.9;
        }
        .section-title {
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            display: inline-block;
            padding-bottom: 0.5rem;
        }
        .card {
            background: transparent;
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
            padding: 2.5rem;
        }
        .card:hover {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.3);
        }
        .input-field {
            background: transparent;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            padding: 0.75rem 0;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
        }
        .input-field:focus {
            border-color: var(--accent-color);
        }
        .action-btn {
            margin-top: 2rem;
            padding: 0.75rem 2rem;
            border: 1px solid var(--text-main);
            background: transparent;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .action-btn:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }
        
        /* Tarot Shuffle Animation */
        .tarot-deck {
            position: relative;
            height: 180px;
            width: 120px;
            margin: 2rem auto;
        }
        .tarot-card-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid var(--accent-color);
            background: #fff;
            border-radius: 4px;
            transition: all 0.5s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--accent-color);
        }
        .shuffling .tarot-card-inner {
            animation: shuffle 0.6s infinite alternate;
        }
        @keyframes shuffle {
            from { transform: translateX(-20px) rotate(-5deg); }
            to { transform: translateX(20px) rotate(5deg); }
        }

        /* Result Area */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(243, 241, 236, 0.98);
            z-index: 2000;
            padding: 2rem;
            overflow-y: auto;
        }
        .result-content {
            max-width: 600px;
            margin: 4rem auto;
            text-align: left;
        }
        .ai-badge {
            font-size: 0.7rem;
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            color: var(--accent-color);
            margin-bottom: 1rem;
            display: inline-block;
        }
        .fade-in {
            animation: fadeIn 1s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card Image Simulation */
        .tarot-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            filter: sepia(0.2) contrast(1.1);
        }
        .card-placeholder {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .tarot-img-crop {
            width: 100%;
            height: 100%;
            background-size: 500% 300%; /* 默认假设 5x3 的网格，后续根据具体图片调整 */
            background-repeat: no-repeat;
        }
        /* 大牌网格 (假设 tarot5.jpg 是 7x3) */
        .img-major { background-size: 700% 300%; }
        /* 小牌网格 (假设 tarot1-4.jpg 是 5x3 或 4x4) */
        .img-minor { background-size: 500% 300%; }
    </style>
</head>

        let currentPrompt = "";

        async function callDoubaoAI(prompt) {
            if (DOUBAO_API_KEY === "「你的实际密钥」") {
                return "AI 密钥尚未配置，请明天在代码中填入密钥后即可开启自动解牌功能。";
            }
            try {
                const response = await fetch(DOUBAO_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DOUBAO_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "doubao-pro-4k", // 这里的模型 ID 可能需要根据您的具体账号调整
                        messages: [
                            { role: "system", content: "你是一位资深的塔罗占卜师，风格简约、自然、富有艺术感，擅长结合 GUGU VINTAGE ART LAB 的氛围进行解读。" },
                            { role: "user", content: prompt }
                        ]
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error("AI调用失败:", error);
                return "抱歉，由于连接星际算法中心失败，暂时无法为您解读。请检查网络或 API 密钥。";
            }
        }

        async function runAstro() {
            const dt = document.getElementById('astro-dt').value;
            const loc = document.getElementById('astro-loc').value;
            currentPrompt = `你好豆包，我出生于 ${dt}，出生地是 ${loc}。请帮我分析我的个人星盘，并结合 GUGU VINTAGE ART LAB 的艺术氛围，给出我的性格、天赋与生命轨迹的解读。`;
            
            showResult('个人星盘解读', '<p class="animate-pulse">正在连通星盘数据，豆包 AI 正在思考中...</p>');
            const aiInterpretation = await callDoubaoAI(currentPrompt);
            updateResult(aiInterpretation);
        }

        async function runBazi() {
            const dt = document.getElementById('bazi-dt').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const genderText = gender === 'male' ? '乾造(男)' : '坤造(女)';
            currentPrompt = `你好豆包，我的出生时间是 ${dt}，性别是 ${genderText}。请帮我进行生辰八字测算，分析我的五行平衡、流年大运以及命运格局。`;
            
            showResult('生辰八字测算', '<p class="animate-pulse">正在排盘中，豆包 AI 正在解析您的命理...</p>');
            const aiInterpretation = await callDoubaoAI(currentPrompt);
            updateResult(aiInterpretation);
        }

        async function runTarot() {
            const deck = document.getElementById('tarot-deck');
            const btn = document.getElementById('tarot-btn');
            const topic = document.getElementById('tarot-topic').value;
            
            deck.classList.add('shuffling');
            btn.disabled = true;
            btn.innerText = '正在洗牌...';

            setTimeout(async () => {
                deck.classList.remove('shuffling');
                btn.disabled = false;
                btn.innerText = '开始翻牌';
                
                const drawnCards = [];
                const tempDeck = [...TAROT_DECK];
                for(let i = 0; i < 3; i++) {
                    const randomIndex = Math.floor(Math.random() * tempDeck.length);
                    drawnCards.push(tempDeck.splice(randomIndex, 1)[0]);
                }
                
                const topicNames = { 'love': '关于情感', 'career': '关于事业', 'daily': '每日指引' };
                currentPrompt = `你好豆包，我刚刚在 GUGU ART LAB 进行了塔罗牌抽选，主题是 [${topicNames[topic]}]。我抽到的三张牌分别是：1. ${drawnCards[0].name} (过去/根源), 2. ${drawnCards[1].name} (现在/现状), 3. ${drawnCards[2].name} (未来/结果)。请帮我分析这组牌意。`;

                const initialHtml = `
                    <div class="space-y-8">
                        <div class="grid grid-cols-3 gap-4">
                            ${drawnCards.map((card, idx) => {
                                const isMajor = card.img === 'tarot5.jpg';
                                const gridX = isMajor ? 7 : 5; // 假设大牌图 7 列，小牌图 5 列
                                const gridY = 3; 
                                const posX = (card.x / (gridX - 1)) * 100;
                                const posY = (card.y / (gridY - 1)) * 100;

                                return `
                                    <div class="text-center">
                                        <div class="w-full aspect-[2/3] border border-accent-color rounded overflow-hidden p-0 bg-white mb-2 card-placeholder">
                                            <div class="tarot-img-crop ${isMajor ? 'img-major' : 'img-minor'}" 
                                                 style="background-image: url('${card.img}'); 
                                                        background-position: ${posX}% ${posY}%;">
                                            </div>
                                            <div class="absolute bottom-0 left-0 w-full bg-white/80 text-[8px] py-1 font-bold">
                                                ${card.name}
                                            </div>
                                        </div>
                                        <div class="text-[9px] uppercase tracking-tighter text-gray-400">
                                            ${idx === 0 ? '过去 / 根源' : idx === 1 ? '现在 / 现状' : '未来 / 结果'}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div id="ai-loading-text" class="pt-4 border-t border-dashed border-gray-300">
                            <p class="text-sm animate-pulse">正在将牌面发送给豆包 AI 进行深度解读...</p>
                        </div>
                    </div>
                `;

                showResult('三牌阵塔罗解读', initialHtml);
                const aiInterpretation = await callDoubaoAI(currentPrompt);
                updateResult(aiInterpretation, true);
            }, 2000);
        }

        function showResult(title, html) {
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-text').innerHTML = html;
            document.getElementById('result-modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function updateResult(aiText, isTarot = false) {
            const container = document.getElementById('result-text');
            if (isTarot) {
                const loadingDiv = document.getElementById('ai-loading-text');
                if (loadingDiv) {
                    loadingDiv.innerHTML = `<p class="text-sm font-semibold mb-2">豆包 AI 解读：</p><div class="text-sm text-gray-600 leading-relaxed">${aiText.replace(/\n/g, '<br>')}</div>`;
                    loadingDiv.classList.remove('animate-pulse');
                }
            } else {
                container.innerHTML = `<div class="text-sm text-gray-600 leading-relaxed">${aiText.replace(/\n/g, '<br>')}</div>`;
            }
        }

        document.getElementById('copy-to-doubao').onclick = function() {
            navigator.clipboard.writeText(currentPrompt).then(() => {
                alert('已为您复制好给豆包的指令，您可以手动粘贴以开启更多对话。');
                window.open('https://www.doubao.com/', '_blank');
            });
        };

        function closeResult() {
            document.getElementById('result-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
